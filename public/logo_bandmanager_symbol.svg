<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" width="100%" height="100%">
  <defs>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b0"/>
      <stop offset="25%" stop-color="#f8d868"/>
      <stop offset="60%" stop-color="#e5b128"/>
      <stop offset="100%" stop-color="#b37e12"/>
    </linearGradient>

    <linearGradient id="soundwaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8d1"/>
      <stop offset="100%" stop-color="#dda51f"/>
    </linearGradient>

    <linearGradient id="spotlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2ca50" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f2ca50" stop-opacity="0.05"/>
    </linearGradient>

    <clipPath id="lowerLoopClip">
      <path d="M 180 220 H 310 C 380 220, 410 270, 410 330 C 410 390, 365 440, 290 440 H 180 V 220 Z"/>
    </clipPath>
  </defs>

  <!-- Logo Symbol Container -->
  <g transform="translate(-10, -20)">
    <!-- AI Sparkle Star -->
    <path d="M 370 45 L 378 77 L 410 85 L 378 93 L 370 125 L 362 93 L 330 85 L 362 77 Z" fill="url(#goldRibbon)"/>

    <!-- Equalizer Soundwave Bars -->
    <g fill="url(#soundwaveGrad)">
      <rect x="95" y="175" width="18" height="70" rx="9"/>
      <rect x="125" y="125" width="18" height="170" rx="9"/>
      <rect x="155" y="145" width="18" height="130" rx="9"/>
      <rect x="185" y="185" width="18" height="50" rx="9"/>
    </g>

    <!-- Main Golden B Ribbon Outline -->
    <path d="M 180 65 H 290 C 350 65, 380 105, 380 145 C 380 185, 345 215, 290 215 H 180 M 180 215 H 310 C 380 215, 410 265, 410 325 C 410 385, 365 435, 290 435 H 125 C 110 435, 98 423, 98 408 C 98 393, 110 381, 125 381 H 180" 
          stroke="url(#goldRibbon)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Concert Stage & Crowd inside lower loop -->
    <g clip-path="url(#lowerLoopClip)">
      <rect x="170" y="210" width="250" height="240" fill="#1b160a"/>
      <!-- Stage Spotlights -->
      <polygon points="230,215 190,435 270,435" fill="url(#spotlight)"/>
      <polygon points="295,215 245,435 345,435" fill="url(#spotlight)"/>
      <polygon points="360,215 310,435 400,435" fill="url(#spotlight)" opacity="0.7"/>
      
      <!-- Crowd Silhouette -->
      <path d="M 160 435 Q 185 390, 205 415 Q 225 375, 245 405 Q 270 360, 290 400 Q 315 370, 335 405 Q 360 380, 380 410 Q 400 390, 420 435 Z" fill="#09090b"/>
      <!-- Rock Horns Hands -->
      <path d="M 268 370 L 272 390 M 276 365 L 280 390" stroke="#09090b" stroke-width="6" stroke-linecap="round"/>
      <path d="M 320 375 L 324 395 M 328 370 L 332 395" stroke="#09090b" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
